id: heart
name: Heart Disease
# Dataset is user-provided; see docs/datasets.md. No raw data is bundled.
dataset_path: data/heart.csv
target_column: target
positive_label: 1
numeric_columns: [age, trestbps, chol, thalach, oldpeak]
categorical_columns: [sex, cp, fbs, restecg, exang, slope, ca, thal]
binary_columns: [sex, fbs, exang]
display_names:
  age: Age
  trestbps: Resting blood pressure
  chol: Serum cholesterol
  thalach: Maximum heart rate
  oldpeak: ST depression
units:
  age: years
  trestbps: mmHg
  chol: mg/dL
  thalach: bpm
valid_ranges:
  age: [1, 120]
  trestbps: [50, 300]
  chol: [50, 1000]
  thalach: [30, 250]
  oldpeak: [-5, 15]
