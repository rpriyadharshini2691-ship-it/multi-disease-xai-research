id: ckd
name: Chronic Kidney Disease
raw_dataset_path: data/ckd.csv
dataset_path: data/processed/ckd.csv
source:
  name: Chronic Kidney Disease
  uci_id: 336
  url: https://archive.ics.uci.edu/dataset/336/chronic+kidney+disease
  doi: 10.24432/C5G020
  original_target: "class (ckd / notckd)"
  license: CC BY 4.0
target_column: target
positive_label: 1
target_mapping:
  type: label_map
  labels: {ckd: 1, notckd: 0}
drop_missing_target: true
duplicate_policy: keep
duplicate_rationale: No exact duplicate rows exist in the CKD data.
numeric_columns: [age, bp, bgr, bu, sc, sod, pot, hemo, pcv, wbcc, rbcc]
categorical_columns: [sg, al, su, rbc, pc, pcc, ba, htn, dm, cad, appet, pe, ane]
binary_columns: [rbc, pc, pcc, ba, htn, dm, cad, pe, ane]
display_names:
  age: Age
  bp: Blood pressure
  bgr: Blood glucose
  bu: Blood urea
  sc: Serum creatinine
  sod: Sodium
  pot: Potassium
  hemo: Hemoglobin
  pcv: Packed cell volume
  wbcc: White blood cell count
  rbcc: Red blood cell count
units:
  age: years
  bp: mmHg
  bgr: mg/dL
  bu: mg/dL
  sc: mg/dL
  sod: mEq/L
  pot: mEq/L
  hemo: g/dL
valid_ranges:
  age: [1, 120]
  bp: [30, 300]
  bgr: [0, 1000]
  bu: [0, 300]
  sc: [0, 50]
  sod: [80, 200]
  pot: [1, 20]
  hemo: [0, 30]
  pcv: [1, 100]
  wbcc: [100, 100000]
  rbcc: [0, 20]
