[build-system]
requires = ["setuptools>=69", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "multi-disease-xai-research"
version = "0.1.0"
description = "Research dashboard for multi-disease prediction and explanation reliability"
readme = "README.md"
requires-python = ">=3.11,<3.12"
dependencies = [
  "alembic>=1.13,<2",
  "bcrypt>=4.1,<5",
  "cryptography>=42,<47",
  "email-validator>=2.1,<3",
  "fastapi>=0.110,<1",
  "joblib>=1.3,<2",
  "matplotlib>=3.8,<4",
  "numpy>=1.26,<3",
  "pandas>=2.1,<3",
  "pydantic-settings>=2.2,<3",
  "python-multipart>=0.0.9,<1",
  "PyJWT>=2.8,<3",
  "PyMySQL>=1.1,<2",
  "PyYAML>=6,<7",
  "reportlab>=4,<5",
  "scikit-learn>=1.4,<2",
  "scipy>=1.11,<2",
  "shap>=0.45,<1",
  "SQLAlchemy>=2,<3",
  "streamlit>=1.32,<2",
  "uvicorn[standard]>=0.27,<1",
  "xgboost>=2,<4",
]

[project.optional-dependencies]
dev = ["mypy>=1.8,<2", "pre-commit>=3.6,<5", "pytest>=8,<9", "pytest-cov>=4.1,<7", "ruff>=0.3,<1", "httpx>=0.27,<1", "types-PyYAML>=6,<7"]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
addopts = "--strict-markers"

[tool.ruff]
line-length = 100
target-version = "py311"
src = ["src"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]
ignore = ["B008"]

[tool.mypy]
python_version = "3.11"
strict = true
mypy_path = "src"
ignore_missing_imports = true
